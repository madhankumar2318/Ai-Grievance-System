# Server Port
server.port=8080

# Spring Application Name
spring.application.name=ai-grievance-system-backend

# Database Configuration (PostgreSQL / Supabase)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.lxjevqkbkxafqknevbwf.supabase.co:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Gemini AI API Key
gemini.api.key=${GEMINI_API_KEY:}

# JWT Secret & Expiration (24 Hours)
jwt.secret=${JWT_SECRET:nDWCeoY5w0QKE/W4d39NQsy+DlJi0fhlD3IJKqgCKs8=}
jwt.expiration=86400000

# Security Passphrases for Administrative Roles
security.passphrase.chief=${CHIEF_PASSPHRASE:Ch-Falcon20}
security.passphrase.authority=${AUTHORITY_PASSPHRASE:Au-Titan18}
security.demo.enabled=${ENABLE_DEMO_ACCOUNTS:false}

# Frontend Client URL for CORS
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
